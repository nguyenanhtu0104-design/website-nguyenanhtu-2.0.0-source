<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Norton Park – Mô Hình 3D Tương Tác | Nguyễn Anh Tú</title>
<link rel="canonical" href="https://nguyenanhtu.vn/cam-nang/norton-park/">
<style>
:root{--bg:#12100d;--card:#1b1814;--line:rgba(176,80,64,.3);--acc:#b05040;--gold:#c8993a;--tx:#f0ebe0;--mut:#9a938a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(18,16,13,.92)}
.back{color:var(--gold);text-decoration:none;font-size:13px;white-space:nowrap;border:1px solid rgba(200,153,58,.35);border-radius:20px;padding:6px 12px}
.ttl{min-width:0}
.ttl b{display:block;font-size:15px;font-family:Georgia,"Times New Roman",serif;letter-spacing:.3px}
.ttl span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.8px;color:#d08470;font-weight:700;margin-top:2px}
.stage{position:relative;flex:1;min-height:0}
model-viewer{width:100%;height:100%;background:radial-gradient(ellipse at 50% 40%,#2a241d 0%,#12100d 70%);--poster-color:transparent}
.bar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(260px,70vw);text-align:center;font-size:12px;color:var(--mut);pointer-events:none}
.bar i{display:block;height:4px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i em{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(18,16,13,.82);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:12px;color:#d9d2c6;white-space:nowrap;pointer-events:none}
.note{padding:10px 16px 14px;font-size:11px;color:var(--mut);font-style:italic;text-align:center;border-top:1px solid var(--line)}
.note a{color:var(--gold)}
</style>
<script>self.ModelViewerElement={meshoptDecoderLocation:'/assets/tools/norton-park-3d/meshopt_decoder.js'};</script>
<script type="module" src="/assets/tools/norton-park-3d/model-viewer.min.js"></script>
</head>
<body>
<header class="top">
  <a class="back" href="/cam-nang/norton-park/">← Về bài dự án</a>
  <div class="ttl"><span>Phối cảnh 3D</span><b>Norton Park · Gamuda Land</b></div>
</header>
<main class="stage">
  <model-viewer id="mv" src="/assets/tools/norton-park-3d/norton-park.glb" poster="/assets/tools/norton-park-3d/poster.webp" alt="Mô hình 3D Norton Park: 6 tòa tháp, hồ bơi và cảnh quan nội khu" camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="2500" rotation-per-second="12deg" camera-orbit="35deg 62deg 86%" min-camera-orbit="auto 5deg auto" max-camera-orbit="auto 88deg auto" interaction-prompt="none" shadow-intensity="0.8" exposure="1.05" environment-image="neutral" loading="eager"></model-viewer>
  <div class="bar" id="bar">Đang tải mô hình 3D…<i><em id="prog"></em></i></div>
  <div class="hint">☝️ Kéo để xoay · chụm hai ngón để phóng to</div>
</main>
<p class="note">Mô hình 3D minh họa, dựng từ phối cảnh dự án; chi tiết theo hồ sơ thiết kế chính thức của chủ đầu tư. · <a href="/cam-nang/norton-park/">Xem phân tích Norton Park</a></p>
<script>
const mv=document.getElementById('mv'),bar=document.getElementById('bar'),prog=document.getElementById('prog');
mv.addEventListener('progress',e=>{const p=e.detail.totalProgress;prog.style.width=(p*100)+'%';if(p>=1)bar.style.display='none'});
mv.addEventListener('load',()=>{bar.style.display='none'});
mv.addEventListener('error',()=>{bar.innerHTML='Không tải được mô hình. Vui lòng thử lại hoặc mở bằng trình duyệt khác.'});
</script>
</body>
</html>
