    <div id="labels"></div>
    <svg id="leaders" aria-hidden="true"></svg>
    <div id="tip" hidden></div>
    <p id="touchHint" hidden><b>Chạm</b> để chọn căn · <b>Kéo</b> để di chuyển · <b>Hai ngón</b> chụm hoặc mở để phóng to, thu nhỏ</p>

    <header class="topbar">
      <a class="tb back" href="/cam-nang/nam-mekong-grand-plaza/" target="_top" aria-label="Về hồ sơ Nam Mekong Grand Plaza">←</a>
      <div class="title"><b>Nam Mekong Grand Plaza</b><span>Vòng xoay A1 · TP mới Bình Dương</span></div>
      <button class="tb" id="bNight" aria-pressed="false">☾ <span>Tối</span></button>
      <button class="tb" id="bLabels" aria-pressed="false">👁 <span>Ẩn thông số</span></button>
    </header>

    <nav class="zonebar" id="zoneChips" aria-label="Chọn phân khu"></nav>

    <nav class="rail" id="rail" aria-label="Công cụ">
      <button class="rb" data-rail="cart"><i><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.6 11.2a2 2 0 0 1-2 1.8H7.6a2 2 0 0 1-2-1.8Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg></i><em id="railCart">0</em><span>Rổ giá</span></button>
      <button class="rb" data-rail="floors"><i><svg viewBox="0 0 24 24"><path d="M3 18h18M3 13h18M3 8h18"/><path d="M8 8V5h8v3"/></svg></i><span>Mặt cắt</span></button>
      <button class="rb" data-rail="env"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg></i><span>Nắng</span></button>
      <button class="rb" data-rail="metro"><i><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="13" rx="3"/><path d="M6 11h12M9 16l-2 4M15 16l2 4M8.5 13.5h.01M15.5 13.5h.01"/></svg></i><span>Metro</span></button>
      <button class="rb" data-rail="blocks"><i><svg viewBox="0 0 24 24"><path d="M4 20V9l5-3 5 3v11"/><path d="M14 20V12l6-2v10"/><path d="M4 20h16"/></svg></i><span>Khối 3D</span></button>
    </nav>

    <nav class="floors" id="floorRail" hidden aria-label="Chọn cao độ cắt"></nav>

    <div class="tools" role="group" aria-label="Thu phóng">
      <button type="button" id="bIn" aria-label="Phóng to">＋</button>
      <button type="button" id="bOut" aria-label="Thu nhỏ">－</button>
    </div>

    <div id="compass" aria-hidden="true">
      <svg viewBox="-50 -50 100 100" width="74" height="74">
        <circle r="46" fill="#0b0a08cc" stroke="#3d382d"/>
        <g id="cRose">
          <path d="M0-40 8-6 0 2 -8-6Z" fill="#e9c683"/><path d="M0 40 8 6 0-2 -8 6Z" fill="#7b7466"/>
          <text y="-30" text-anchor="middle" font-size="13" font-weight="700" fill="#12100d">B</text>
        </g>
        <g id="cSun" style="display:none"><circle cy="-38" r="5.5" fill="#ffd45e"/><circle cy="-38" r="10" fill="#ffd45e" opacity=".25"/></g>
      </svg>
    </div>

    <footer class="bottombar">
      <button class="bb" id="bNorth">▲ <span>Bắc</span></button>
      <button class="bb" id="bHome">↻ <span>Toàn cảnh</span></button>
      <div class="bb docao" role="group" aria-label="Góc nhìn theo độ cao">
        <span class="mute">Độ cao <b id="doCao">—</b></span>
        <button type="button" data-docao="500" title="Nhìn từ độ cao 500 m">500 m</button>
        <button type="button" data-docao="1000" title="Nhìn từ độ cao 1 km">1 km</button>
      </div>
      <div class="bb time"><b id="clock">—</b><input id="sunh" type="range" min="0" max="143" step="1" aria-label="Giờ trong ngày để xem hướng nắng"></div>
      <button class="bb" id="bBase">🗺 <span id="baseName">Bản đồ</span></button>
      <button class="bb" id="bRanh" aria-pressed="true">⬠ <span>Ranh đất</span></button>
    </footer>
    <p class="caption" id="caption"></p>

    <div id="nogl" hidden>
      <b>Trình duyệt chưa bật được đồ họa 3D.</b>
      <span>Anh/chị vẫn chọn căn, thêm vào giỏ và gửi yêu cầu bằng danh sách bên cạnh.</span>
    </div>
  </section>

  <aside id="panel" aria-label="Chọn căn, bản tính và tham vấn">
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="pane" role="tabpanel" tabindex="-1"></div>
    <div id="flow" class="flow" aria-label="Căn đã chọn và chat với tư vấn"></div>
  </aside>
</div>
