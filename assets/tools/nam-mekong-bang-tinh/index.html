  let h="<table><thead><tr><th>Đợt</th><th>Nội dung</th><th>Tỷ lệ</th>";
  if(iv)h+="<th>Nguồn</th>";
  h+="<th>Số tiền (VNĐ)</th><th>Lũy kế (VNĐ)</th></tr></thead><tbody>";
  let cm=0,tt=0;
  sc.forEach(r=>{
    let a=0,pd="",cl="",sg="";
    if(r.fx){a=r.fx;pd=fm(r.fx)+" đ"}
    else if(r.kpbt){a=p.kp;pd="2% KPBT";cl="rkp"}
    else if(r.p!=null){a=p.h*r.p;pd=fp(r.p)}
    cm+=a;tt+=a;
    if(iv&&r.sr==="kh")sg='<span class="tg tg-k">KH</span>';
    let nh="";
    if(r.nh){const na=p.h*r.nh;cm+=na;tt+=na;nh=`<tr class="rvat"><td class="c"></td><td>NH giải ngân ${fp(r.nh)}</td><td class="c">${fp(r.nh)}</td><td class="c"><span class="tg tg-n">NH</span></td><td class="n">${fm(na)}</td><td class="n">${fm(cm)}</td></tr>`}
    h+=`<tr class="${cl}"><td class="c">${r.d}</td><td>${r.s}</td><td class="c">${pd}</td>`;
    if(iv)h+=`<td class="c">${sg}</td>`;
    h+=`<td class="n">${fm(a)}</td><td class="n">${fm(cm)}</td></tr>${nh}`;
  });
  const cs=iv?4:3;
  h+=`<tr class="rtot"><td class="c" colspan="${cs-1}"></td><td style="text-align:right">TỔNG CỘNG</td>`;
  if(iv)h+="<td></td>";
  h+=`<td class="n">${fm(tt)}</td><td class="n">${fm(tt)}</td></tr></tbody></table>`;
  return h;
}

function rD(t,p){
  let h=`<h3>Chi tiết chiết khấu</h3><div class="ckl"><span>Giá gốc (chưa VAT, KPBT)</span><span style="font-weight:600">${fm(p.b)} đ</span></div><div class="ckl"><span>CK ưu đãi mở bán (${fp(p.ur)})</span><span class="cv">-${fm(p.u)} đ</span></div>`;
  if(p.r>0)h+=`<div class="ckl"><span>CK thanh toán sớm (${fp(p.r)})</span><span class="cv">-${fm(p.s)} đ</span></div>`;
  h+=`<hr style="border:none;border-top:1px solid var(--f2);margin:6px 0"><div class="ckl"><span>Tổng CK (${fp(p.ur+p.r)})</span><span class="cv" style="font-size:14px">-${fm(p.k)} đ</span></div><div class="ckl"><span>Giá sau CK</span><span style="font-weight:600">${fm(p.bc)} đ</span></div><div class="ckl"><span>VAT 10%</span><span>${fm(p.v)} đ</span></div><div class="ckl"><span>KPBT 2%</span><span>${fm(p.kp)} đ</span></div><hr style="border:none;border-top:1px solid var(--f2);margin:6px 0"><div class="ckl"><span style="font-weight:700">Tổng thanh toán</span><span style="font-weight:700;font-size:15px;color:var(--b9)">${fm(p.f)} đ</span></div>`;
  if(t==="vay30"||t==="vay20")h+=`<hr style="border:none;border-top:1px dashed var(--f3);margin:6px 0"><div class="ckl"><span style="font-style:italic;font-size:11px">HTLS: tối đa 70% giá trị CH, 24 tháng | Vay tối đa 35 năm</span></div>`;
  return h;
}

function showLayout(u,uk){
  const lyW=document.getElementById("lyW");
  const lyI=document.getElementById("lyI");
  const lyT=document.getElementById("lyT");
  if(uk && STUDIO_UNITS.has(uk)){
    lyI.src=ISTUDIO;
    lyT.textContent="Mặt bằng căn hộ — Căn Studio";
    lyW.style.display="block";
  }else if(uk && ONEPN_UNITS.has(uk)){
    lyI.src=I1PN;

    lyW.style.display="block";
  }else{
    lyW.style.display="none";
  }

function render(){
  if(!cU||!cUP)return;
  const u=U[cU];
  const lp=calcLP(u);
  const p=calc(lp,cT);
  document.getElementById("sB").textContent=fm(p.b)+" đ";
  document.getElementById("sK").textContent="-"+fm(p.k)+" đ";
  document.getElementById("sFi").textContent=fm(p.f)+" đ";
  document.getElementById("sR").style.display="grid";
  document.getElementById("tS").innerHTML=rT(cT,p);
  document.getElementById("tS").style.display="block";
  document.getElementById("dI").innerHTML=rD(cT,p);
  document.getElementById("dI").style.display="block";
  document.getElementById("pS").style.display="block";
  const twLabel=cTw==="G1"?"Tòa G1":"Tòa G2";
  document.getElementById("pU").textContent=`${twLabel} | Căn ${cU.split(".").slice(1).join(".")} | TT: ${u.t}m² | TTg: ${u.g}m² | Niêm yết: ${fm(lp)} đ`;
  document.getElementById("xLP").value=fm(lp)+" đ";
  const cl=document.getElementById("xCl").value.trim(),co=document.getElementById("xCo").value.trim(),cp=document.getElementById("xCp").value.trim(),pa=[];
  if(cl)pa.push("KH: "+cl);if(co)pa.push("TVV: "+co);if(cp)pa.push("SĐT TVV: "+cp);
  document.getElementById("pC").textContent=pa.join(" | ");
}

function sM(ch){
  const m=document.getElementById("fpM");
  const uc=cTw==="G1"?UC_G1:UC_G2;
  const fo=cTw==="G1"?FO_G1:FO_G2;
  const ov=fo[cF];
  const c=(ov&&ov[ch])||uc[ch];
  if(!c){m.style.display="none";return}
  m.style.left=c[0]+"%";m.style.top=c[1]+"%";m.style.display="block";
}

function oTC(){
  cTw=document.getElementById("sT").value;
  const sF=document.getElementById("sF");
  sF.innerHTML='<option value="">-- Chọn tầng --</option>';
  if(!cTw){document.getElementById("fpW").style.display="none";clr();return}
  const floors=FLOORS[cTw];
  floors.forEach(f=>{
    const o=document.createElement("option");
    o.value=f;o.textContent="Tầng "+f;sF.appendChild(o);
  });
  clr();
}

function oFC(){
  cF=document.getElementById("sF").value;
  const s=document.getElementById("sU");
  s.innerHTML='<option value="">-- Chọn căn --</option>';
  if(!cF||!cTw){document.getElementById("fpW").style.display="none";clr();return}
  const fiKey=cTw+"."+cF;
  if(FI[fiKey]){
    document.getElementById("fpI").src=FI[fiKey];
    document.getElementById("fpW").style.display="block";
  }else{
    document.getElementById("fpW").style.display="none";
  }
  document.getElementById("fpM").style.display="none";
  const px=cTw+"."+cF+".";
  Object.keys(U).filter(k=>k.startsWith(px)).sort((a,b)=>{
    const na=parseInt(a.split(".CH")[1]),nb=parseInt(b.split(".CH")[1]);
    return na-nb;
  }).forEach(k=>{
    const u=U[k],ch=k.split(".")[2];
    const o=document.createElement("option");
    o.value=k;o.textContent=`${ch} — TT: ${u.t}m² | TTg: ${u.g}m²`;s.appendChild(o);
  });
  clr();
}

function clr(){
  cU=null;
  ["xTT","xTG","xLP"].forEach(i=>document.getElementById(i).value="");
  ["sR","tB","tS","dI","pS","lyW"].forEach(i=>document.getElementById(i).style.display="none");
}

function oUC(){
  const c=document.getElementById("sU").value;
  if(!c){clr();document.getElementById("fpM").style.display="none";return}
  cU=c;
  const u=U[c],ch=c.split(".")[2];
  document.getElementById("xTT").value=u.t+" m²";
  document.getElementById("xTG").value=u.g+" m²";
  if(cUP){
    document.getElementById("xLP").value=fm(calcLP(u))+" đ";
  }
  document.getElementById("tB").style.display="flex";
  sM(ch);
  showLayout(u,c);
  render();
}

function sw(t){cT=t;document.querySelectorAll(".tb").forEach(b=>b.classList.toggle("act",b.dataset.t===t));render()}

document.getElementById("xCl").addEventListener("input",()=>{if(cU)render()});
document.getElementById("xCo").addEventListener("input",()=>{if(cU)render()});
document.getElementById("xCp").addEventListener("input",function(){const v=this.value.replace(/[^0-9+\s.\-]/g,"");if(v!==this.value)this.value=v;if(cU)render()});
document.getElementById("xUP").addEventListener("input",function(){
  const raw=this.value.replace(/[^0-9]/g,"");
  if(raw){
    const num=parseInt(raw);
    this.value=num.toLocaleString("vi-VN");
  }
  onUP();
});
